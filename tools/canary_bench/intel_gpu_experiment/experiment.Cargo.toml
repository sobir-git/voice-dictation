[package]
name = "canary-backend-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde_json = "1"
transcribe-rs = { version = "=0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "=0.2.3", default-features = false, features = ["openmp", "vulkan"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
transcribe-cpp-sys = { path = "native" }
