[package]
name = "voice-dictation"
version = "0.1.0"
edition = "2021"
[[bin]]
name = "voice-dictation"
path = "ui/main.rs"
[lib]
path = "service/lib.rs"
[[bin]]
name = "speech-service"
path = "service/main.rs"
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rusqlite = { version = "0.38", features = ["bundled"] }
evdev = "0.13"
libc = "0.2"
fs2 = "0.4"
tempfile = "3"
hound = "3.5"
signal-hook = "0.3"
log = "0.4"
ksni = { version = "0.3.6", features = ["blocking"] }
ct2rs = { version = "0.10.1", default-features = false, features = ["ruy", "dnnl", "openmp-runtime-comp"] }
rustfft = "6"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
voice_activity_detector = "0.2.1"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
transcribe-cpp = { version = "0.2.3", default-features = false, features = ["openmp"] }

fire-ui = { git = "https://github.com/sobir-git/fire-ui", tag = "v0.7.0" }
fire-ui-widgets = { git = "https://github.com/sobir-git/fire-ui", tag = "v0.7.0" }
fire-ui-native = { git = "https://github.com/sobir-git/fire-ui", tag = "v0.7.0", features = ["clipboard", "accessibility", "inspection"] }
fire-ui-fonts = { git = "https://github.com/sobir-git/fire-ui", tag = "v0.7.0" }
fire-ui-text = { git = "https://github.com/sobir-git/fire-ui", tag = "v0.7.0" }
fire-ui-cairo = { git = "https://github.com/sobir-git/fire-ui", tag = "v0.7.0", features = ["x11"] }
serde_json = "1"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
[profile.dev]
opt-level = 1
debug = 1
incremental = false

[profile.test]
opt-level = 1
debug = 1
incremental = false

# Native speech libraries otherwise produce multi-gigabyte debug archives.
[profile.dev.package.onednn-src]
opt-level = 3
debug = 0

[profile.dev.package.ct2rs]
opt-level = 3
debug = 0

[profile.dev.package.ort-sys]
opt-level = 3
debug = 0
